flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.svg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.svg"
  web:
    generate: true
    image_path: "assets/logo.svg"
    background_color: "#F6F0ED"
    theme_color: "#CE2161"

name: memoka_flutter
description: Memoka — chat-style notes organized in topical channels.
publish_to: 'none'

# Version is display-only in local dev ("DEV"). Production builds receive
# the real version via --dart-define=APP_VERSION from the release workflow.
version: 0.0.0+1

environment:
  sdk: '^3.8.0'
  flutter: '^3.32.0'

dependencies:
  flutter:
    sdk: flutter
  memoka_client:
    path: ../memoka_client
  serverpod_flutter: 3.3.1

  # State management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Local database
  drift: ^2.22.1
  drift_flutter: ^0.2.4

  # Networking
  http: ^1.3.0
  http_parser: ^4.0.0
  connectivity_plus: ^6.1.4

  # UI
  phosphor_flutter: ^2.1.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.5
  photo_view: ^0.14.0
  flutter_markdown: ^0.7.4+1
  markdown: ^7.3.0
  cached_network_image: ^3.4.1
  scrollable_positioned_list: ^0.3.8
  flutter_staggered_grid_view: ^0.7.0

  # Media
  file_picker: ^8.1.4
  image_picker: ^1.0.0
  video_player: ^2.9.2
  audioplayers: ^6.5.1
  gal: ^2.3.0

  # Platform / utilities
  path: ^1.8.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  open_filex: ^4.5.0
  share_plus: ^10.0.0
  receive_sharing_intent: ^1.8.1
  web: ^1.1.1
  universal_html: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.0
  flutter_lints: '>=3.0.0 <7.0.0'
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/logo.svg
    - assets/images/
    - assets/images/backgrounds/
