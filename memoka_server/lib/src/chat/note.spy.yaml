### A note within a channel.
class: Note
table: notes

fields:
  ### The ID of the channel this note belongs to.
  channelId: int, relation(parent=channels, onDelete=Cascade)
  ### The content of the note.
  content: String
  ### Link preview metadata (if URL detected in content).
  linkPreview: LinkPreview?
  ### Media attachments associated with this note.
  attachments: List<MediaAttachment>?
  ### Original channel ID before archiving (for restoration).
  originalChannelId: int?
  ### When the note was created.
  createdAt: DateTime, default=now
  ### When the note was last updated.
  updatedAt: DateTime, default=now

indexes:
  channel_created_idx:
    fields: channelId, createdAt
