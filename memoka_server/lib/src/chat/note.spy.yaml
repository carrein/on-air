### A note within a channel.
class: Note
table: notes

fields:
  ### The ID of the channel this note belongs to.
  channelId: int, relation(parent=channels, onDelete=Cascade)
  ### The content of the note.
  content: String
  ### Link preview metadata (if URL detected in content).
  linkPreview: LinkPreview?
  ### Media attachments associated with this note.
  attachments: List<MediaAttachment>?
  ### Whether this note has been archived (soft-deleted).
  archived: bool, default=false
  ### When the note was archived.
  archivedAt: DateTime?
  ### When the note was created.
  createdAt: DateTime, default=now
  ### When the note was last updated.
  updatedAt: DateTime, default=now
  ### Idempotency key for offline-created notes. NULL for online-created notes.
  clientMutationId: String?
  ### Sync version — set to globalVersion on each mutation.
  version: int, default=0
  ### Permanent delete tombstone. NULL = not deleted. Set instead of physical delete for sync protocol.
  deletedAt: DateTime?

indexes:
  channel_created_idx:
    fields: channelId, createdAt
  archived_updated_idx:
    fields: archived, updatedAt
  client_mutation_idx:
    fields: clientMutationId
    unique: true
  notes_version_idx:
    fields: version
