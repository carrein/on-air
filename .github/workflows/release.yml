name: Release

# Trigger only when a release is published
on:
  release:
    types: [published]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Serverpod code
        run: |
          cd memoka_server
          dart pub get
          dart pub global activate serverpod_cli 3.2.3
          serverpod generate

      - name: Flutter pub get
        run: flutter pub get
        working-directory: memoka_flutter

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > memoka_flutter/memoka-release.keystore

      - name: Write key.properties
        run: |
          cat > memoka_flutter/android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../../memoka-release.keystore
          EOF

      - name: Build release APK
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          flutter build apk --release --build-name="${VERSION}" --build-number="${{ github.run_number }}"
        working-directory: memoka_flutter

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          APK_SRC="memoka_flutter/build/app/outputs/flutter-apk/app-release.apk"
          APK_DST="memoka_flutter/build/app/outputs/flutter-apk/memoka-${TAG}.apk"
          cp "${APK_SRC}" "${APK_DST}"
          gh release upload "${TAG}" "${APK_DST}" --clobber

  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Set up Flutter (includes Dart, needed for serverpod generate)
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Generate Serverpod code (required for memoka_client)
      - name: Generate Serverpod code
        run: |
          cd memoka_server
          dart pub get
          dart pub global activate serverpod_cli 3.2.3
          serverpod generate

      # Set up Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract version from release tag
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
