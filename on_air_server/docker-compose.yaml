services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: on_air
      POSTGRES_PASSWORD: "aNymIlgOp8PULY6tYM-0pakfxz7qtAMH"
    volumes:
      - on_air_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "BFfi2vex-rfkxR76RKlG83-nXwDw_e1W"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: on_air_test
      POSTGRES_PASSWORD: "HEDBcpu2NNA1cMwC3EmK83YS-78JRpwB"
    volumes:
      - on_air_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "VrcHvH3Qje8yrXsGIDWig3dxx-oNR-PX"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  on_air_data:
  on_air_test_data:
